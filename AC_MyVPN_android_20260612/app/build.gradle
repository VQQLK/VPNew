// APP-LEVEL build.gradle
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.myvpn.xray'
    compileSdk 34

    defaultConfig {
        applicationId "com.myvpn.xray"
        minSdk 26           // Android 8.0+
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            signingConfig signingConfigs.debug  // замените на release keystore
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        jniLibs {
            // Не сжимать .so файлы — Xray читает их напрямую
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // ── Xray-core Android ───────────────────────────────────────
    // libv2ray.aar — JNI-обёртка над Xray-core для Android
    // Репозиторий: https://github.com/2dust/AndroidLibXrayLite
    // Лицензия: MPL-2.0
    // Предоставляет: libxray.Libxray.runXray(), stopXray()
    implementation files('libs/libv2ray.aar')

    // ── AndroidX ────────────────────────────────────────────────
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
